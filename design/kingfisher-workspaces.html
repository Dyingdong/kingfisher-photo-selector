<div id="kf-workspaces">
<style>
#kf-workspaces{color-scheme:dark;--shell:#192122;--panel:#202a2a;--canvas:#12191a;--line:#354342;--text:#e7eeea;--dim:#afbfba;--mint:#9ee0c9;--active:#2a4840;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--shell);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#kf-workspaces *{box-sizing:border-box}#kf-workspaces [hidden]{display:none!important}
#kf-workspaces button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#kf-workspaces button:hover{border-color:var(--mint)}#kf-workspaces button[aria-pressed=true],#kf-workspaces button[aria-selected=true],#kf-workspaces .primary{background:var(--active);border-color:#588473;color:#d4faeb}
#kf-workspaces button:disabled{opacity:.45}#kf-workspaces .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#kf-workspaces .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
#kf-workspaces .brand{font-weight:600;letter-spacing:.025em}#kf-workspaces .brand b{color:var(--mint);margin-right:8px}
#kf-workspaces nav{display:flex;gap:6px}#kf-workspaces .bar{padding:10px 12px;border-bottom:1px solid var(--line);justify-content:space-between}
#kf-workspaces .dim,#kf-workspaces small{color:var(--dim)}#kf-workspaces small{font-size:12px}#kf-workspaces .green{color:var(--mint)}
#kf-workspaces .workspace{display:grid;grid-template-columns:168px minmax(0,1fr) 175px}
#kf-workspaces aside{background:var(--panel);padding:12px;min-width:0}#kf-workspaces .left{border-right:1px solid var(--line)}#kf-workspaces .right{border-left:1px solid var(--line)}
#kf-workspaces .heading{display:block;margin-bottom:10px;font-weight:600}
#kf-workspaces .stack{display:grid;gap:7px}#kf-workspaces .stack button{text-align:left;min-width:0}
#kf-workspaces .entry{display:flex;align-items:center;gap:7px}#kf-workspaces .entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kf-workspaces .thumb{width:34px;aspect-ratio:1.3;background-size:200% 200%;border-radius:3px;flex:none}
#kf-workspaces .stage{min-width:0;background:var(--canvas);padding:14px;display:grid;align-content:center;gap:8px}
#kf-workspaces .photo{aspect-ratio:1.5;background-color:#405247;background-size:200% 200%;border-radius:5px;overflow:hidden}
#kf-workspaces .photo>div{height:100%;background-image:inherit;background-size:inherit;background-position:inherit;transform-origin:50% 40%}
#kf-workspaces .photo.zoom>div{transform:scale(1.8)}
#kf-workspaces .compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px;background:var(--canvas)}
#kf-workspaces .caption{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin:0 0 6px}
#kf-workspaces footer{padding:10px 12px;border-top:1px solid var(--line);justify-content:space-between}
#kf-workspaces hr{border:0;border-top:1px solid var(--line);margin:12px 0}
#kf-workspaces details{margin-top:9px}#kf-workspaces summary{color:var(--dim)}#kf-workspaces .strip button{display:grid;gap:4px;text-align:left}#kf-workspaces .strip .thumb{width:65px}#kf-workspaces [data-stars]{gap:4px}#kf-workspaces [data-stars] button{padding:4px 5px}
@media(max-width:660px){#kf-workspaces .workspace{grid-template-columns:1fr}#kf-workspaces .stage{grid-row:1}#kf-workspaces .left,#kf-workspaces .right{border:0;border-top:1px solid var(--line)}#kf-workspaces .left .stack{grid-template-columns:repeat(2,minmax(0,1fr))}#kf-workspaces .compare{padding:8px;gap:8px}}
</style>
<header class="top"><span class="brand"><b aria-hidden="true">◈</b>Kingfisher-PhotoSelector</span><nav role="tablist" aria-label="工作区"><button id="kf-screening-tab" role="tab" aria-controls="kf-screening" aria-selected="true">照片筛选</button><button id="kf-compare-tab" role="tab" aria-controls="kf-compare" aria-selected="false">候选对比</button></nav></header>
<section id="kf-screening" role="tabpanel" aria-labelledby="kf-screening-tab">
  <div class="bar row"><span>照片 <span class="dim">／</span> 河边翠鸟</span><button class="primary" data-action="send">加入对比</button></div>
  <div class="workspace">
    <aside class="left"><span class="heading">照片</span><div class="stack" data-list></div></aside>
    <div class="stage"><div class="photo" data-photo="current" role="img" aria-label="当前翠鸟照片"><div></div></div><div class="row"><button data-action="screenZoom" aria-pressed="false">放大检查</button><small data-current></small></div></div>
    <aside class="right"><span class="heading">照片详情</span><span class="green" data-verdict></span><details><summary>展开看详细判别依据</summary><p>示例判定 · 主体区域锐度较高</p></details><hr><span class="heading">拍摄参数</span><small>1/3200 s · f/5.6<br>ISO 1600 · 500 mm</small><hr><span class="heading">人工星级</span><div class="row" data-stars></div></aside>
  </div>
  <footer class="row"><small data-screen-status aria-live="polite"></small><details><summary>Bridge 元数据</summary><small>写入判定与说明 · 查看写入前备份</small></details></footer>
</section>
<section id="kf-compare" role="tabpanel" aria-labelledby="kf-compare-tab" hidden>
  <div class="bar row"><span data-count></span><div class="row"><button data-action="pin">候选设为基准</button><button data-action="zoom" aria-pressed="false">同步放大</button></div></div>
  <div class="compare">
    <div><div class="caption"><span class="green">基准</span><small data-base></small></div><div class="photo" data-photo="base" role="img" aria-label="基准翠鸟照片"><div></div></div></div>
    <div><div class="caption"><span>候选</span><small data-candidate></small></div><div class="photo" data-photo="candidate" role="img" aria-label="候选翠鸟照片"><div></div></div></div>
  </div>
  <footer class="row"><div class="row strip" data-strip></div><div class="row"><button data-action="prev" aria-label="上一张候选">←</button><button data-action="next" aria-label="下一张候选">→</button><button class="primary" data-action="keep" aria-pressed="false">保留候选</button></div></footer>
</section>

 const items = ['主体清晰','主体清晰','焦点正常','主体清晰'].map((verdict,i)=>({name:'KF_'+(1427+i)+'.CR3', verdict, rating:0, keep:false}));
 const set = new Set([0,1]);
 const queue = new Set([0,1,2]);
 let current=0, base=0, candidate=1, screenZoom=false, zoom=false, status='';
 const button = (label, action, value) => {
   const node = document.createElement('button');
   node.textContent=label; node.dataset.action=action; node.dataset.value=value;
   return node;
 };
 function paint(node,i) {
   node.style.backgroundImage='url('+image+')';
   node.style.backgroundPosition=(i%2?'100%':'0%')+' '+(i>1?'100%':'0%');
 }
 const list=items.map((item,i)=>{
   const node=button(item.name,'pick',i);
   const thumb=document.createElement('span'); thumb.className='thumb'; paint(thumb,i);
   const label=document.createElement('span'); label.textContent=item.name;
   node.className='entry'; node.replaceChildren(thumb,label); q('[data-list]').append(node);
   return node;
 });
 const stars=[1,2,3,4,5].map(i=>{
   const node=button('★','rate',i); node.setAttribute('aria-label',i+' 星');
   q('[data-stars]').append(node);return node;
 });
 const strip=items.map((item,i)=>{
   const node=button(item.name,'candidate',i);
   const thumb=document.createElement('span'); thumb.className='thumb'; paint(thumb,i);
   const label=document.createElement('small'); node.replaceChildren(thumb,label);
   q('[data-strip]').append(node);return node;
 });
 function tab(name) {
   for(const key of ['screening','compare']){
     const active=key===name;
     q('#kf-'+key+'-tab').setAttribute('aria-selected',active);
     q('#kf-'+key).hidden=!active;
   }
 }
 function render() {
   const item=items[current];
   list.forEach((node,i)=>{
     node.setAttribute('aria-pressed',set.has(i));
     node.setAttribute('aria-current',i===current?'true':'false');
     node.lastElementChild.textContent=(i===current?'› ':'')+items[i].name;
   });
   stars.forEach((node,i)=>node.setAttribute('aria-pressed',i<item.rating));
   strip.forEach((node,i)=>{
     node.hidden=!queue.has(i);
     node.setAttribute('aria-pressed',i===candidate);
     node.lastElementChild.textContent=(items[i].keep?'✓ ':'')+items[i].name.slice(3,7)+(i===base?' · 基准':'');
     node.setAttribute('aria-label',items[i].name+(i===base?'，基准':''));
   });
   for(const [key,i,magnified] of [['current',current,screenZoom],['base',base,zoom],['candidate',candidate,zoom]]){
     const node=q('[data-photo="'+key+'"]'); paint(node,i);node.classList.toggle('zoom',magnified);
   }
   q('[data-current]').textContent=item.name;
   q('[data-verdict]').textContent=item.verdict;
   q('[data-base]').textContent=items[base].name;
   q('[data-candidate]').textContent=items[candidate].name;
   q('[data-count]').textContent=queue.size+' 张待比 · '+[...queue].filter(i=>items[i].keep).length+' 张已保留';
   q('[data-screen-status]').textContent=status||'示例会话 · 已选 '+set.size+' / '+items.length+' 张';
   q('[data-action="zoom"]').setAttribute('aria-pressed',zoom);
   q('[data-action="screenZoom"]').setAttribute('aria-pressed',screenZoom);
   q('[data-action="keep"]').setAttribute('aria-pressed',items[candidate].keep);
   q('[data-action="keep"]').textContent=items[candidate].keep?'取消保留':'保留候选';
   q('[data-action="pin"]').disabled=base===candidate;
 }
 function step(delta) {
   const options=[...queue].filter(i=>i!==base);
   if(!options.length)return;
   const index=options.includes(candidate)?options.indexOf(candidate):(delta>0?-1:0);
   candidate=options[(index+delta+options.length)%options.length];
 }
 q('#kf-screening-tab').onclick=()=>tab('screening');
 q('#kf-compare-tab').onclick=()=>tab('compare');
 root.addEventListener('click',event=>{
   const node=event.target.closest('[data-action]');if(!node)return;
   const value=Number(node.dataset.value);
   switch(node.dataset.action){
     case 'pick':
       current=value;status='';
       if(event.metaKey||event.ctrlKey){if(set.has(value)&&set.size>1)set.delete(value);else set.add(value);}
       else{set.clear();set.add(value);}
       break;
     case 'send': set.forEach(i=>queue.add(i));status='已加入对比';tab('compare');q('#kf-compare-tab').focus();break;
     case 'rate': items[current].rating=items[current].rating===value?0:value;break;
     case 'candidate': candidate=value;break;
     case 'pin': base=candidate;step(1);break;
     case 'prev': step(-1);break;
     case 'next': step(1);break;
     case 'zoom': zoom=!zoom;break;
     case 'screenZoom': screenZoom=!screenZoom;break;
     case 'keep': items[candidate].keep=!items[candidate].keep;break;
   }
   render();
 });
 root.addEventListener('keydown',event=>{
   if(q('#kf-compare').hidden||!['ArrowLeft','ArrowRight'].includes(event.key)||event.target.closest('[role="tab"]'))return;
   event.preventDefault();step(event.key==='ArrowLeft'?-1:1);render();
 });
 render();
})();
</script>
